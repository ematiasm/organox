# Development Postgres. A single service: enough until there is a domain.
services:
  db:
    image: postgres:18-alpine
    container_name: organox_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: organox
      POSTGRES_PASSWORD: organox_dev_password
      POSTGRES_DB: organox
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and the image
      # VOLUME to /var/lib/postgresql. Mounting the old /var/lib/postgresql/data
      # makes the container refuse to start. See L21.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organox -d organox"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db_data:
